[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Hashed assets (JS, CSS, the ggsql wasm) — safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback: serve the app shell for non-file paths (e.g. /about) so
# path-based pages load on a hard request. Existing files (assets) win over
# this rewrite, so it never shadows /assets/*.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
